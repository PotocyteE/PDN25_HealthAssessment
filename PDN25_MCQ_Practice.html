function loadQuiz() {
  const lecture = document.getElementById('lecture').value;
  const quizDiv = document.getElementById('quiz');
  const submitBtn = document.getElementById('submitBtn');
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '';
  quizDiv.innerHTML = '';
  if (!lecture || !quizzes[lecture]) {
    submitBtn.style.display = 'none';
    return;
  }
  const questions = quizzes[lecture];
  const letters = ['A', 'B', 'C', 'D'];
  questions.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.id = 'qdiv-' + idx;
    let html = `<p><strong>${idx+1}. ${item.q}</strong></p><div class="options">`;
    item.opts.forEach((opt, oidx) => {
      html += `<label><input type="radio" name="q${idx}" value="${oidx}"> ${letters[oidx]}. ${opt}</label>`;
    });
    html += `</div><div id="explain-${idx}" class="explanation" style="display:none;"></div>`;
    div.innerHTML = html;
    quizDiv.appendChild(div);
  });
  submitBtn.style.display = 'block';
}

function submitQuiz() {
  const lecture = document.getElementById('lecture').value;
  if (!lecture || !quizzes[lecture]) return;
  const questions = quizzes[lecture];
  const letters = ['A', 'B', 'C', 'D'];
  let score = 0;

  questions.forEach((item, idx) => {
    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
    const qdiv = document.getElementById('qdiv-' + idx);
    const explainDiv = document.getElementById('explain-' + idx);
    const labels = qdiv.querySelectorAll('label');

    // Reset styles
    labels.forEach(l => l.classList.remove('correct-option', 'wrong-option'));

    const isCorrect = selected && parseInt(selected.value) === item.a;
    if (isCorrect) score++;

    // Highlight correct answer
    labels[item.a].classList.add('correct-option');
    if (selected && !isCorrect) {
      labels[parseInt(selected.value)].classList.add('wrong-option');
    }

    // Build explanation
    const correctLetter = letters[item.a];
    const correctText = item.opts[item.a];
    let exp = `<div class="q-result">${isCorrect ? '✓ Correct' : '✗ Incorrect'}</div>`;
    exp += `<strong>Correct answer: ${correctLetter}. ${correctText}</strong><br>`;
    if (item.explain) {
      exp += item.explain;
    } else {
      exp += `This is the correct option based on the lecture content.`;
    }
    explainDiv.innerHTML = exp;
    explainDiv.style.display = 'block';
  });

  document.getElementById('result').innerHTML = `You scored <strong>${score}</strong> out of <strong>${questions.length}</strong>.`;
  document.getElementById('submitBtn').style.display = 'none';
}
</script>
